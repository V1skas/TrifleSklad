[project]
name = "triflesklad"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.12.7"
dependencies = [
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.39",
    "alembic==1.15.1",
    "aiomysql==0.2.0",
    "pymysql==1.1.1",
    "reflex==0.7.4",
    "sqlmodel==0.0.24",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
