[project]
name = "triflesklad"
version = "0.3.2"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql==0.2.0",
    "pydantic>=2.13.4",
    "pymysql[rsa]>=1.2.0",
    "reflex[db]>=0.9.6",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.1.1",
    "python-lsp-server[all]>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.pylsp.plugins.pyright]
enabled = true

[tool.pylsp.plugins.jedi_completion]
enabled = false  # Выключаем стандартный Jedi, если хотим всё от Pyright

[tool.pylsp.plugins.rope_autoimport]
enabled = true   # Бонус: автоимпорт недостающих библиотек


