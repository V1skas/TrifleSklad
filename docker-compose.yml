services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - app_data:/TrifleSklad/data
    ports:
      - "80:3000"
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}

volumes:
  mysql_data:
  app_data: